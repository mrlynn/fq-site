<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Fiscal Quarter link preview</title>
<!-- The source of og.png, the 1200 by 630 link preview. Render it with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=og.png http://localhost:4317/og.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #EEF1EC; color: #0E2A23;
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
  }
  .bar { position: absolute; inset: 0 0 auto 0; height: 44px; background: rgba(14, 42, 35, 0.9); }
  .pill {
    position: absolute; top: 8px; right: 152px; height: 28px; padding: 0 14px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.2); color: #fff; font-size: 17px; font-weight: 500;
    display: flex; align-items: center; font-variant-numeric: tabular-nums;
  }
  .panel { position: absolute; top: 40px; right: 60px; width: 380px; }
  .text { position: absolute; left: 72px; top: 118px; width: 640px; }
  h1 { margin: 0; font-size: 104px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.92; }
  p { margin: 28px 0 0; font-size: 34px; font-weight: 500; line-height: 1.22; letter-spacing: -0.01em; max-width: 600px; }
  .line { position: absolute; left: 72px; bottom: 82px; width: 620px; display: flex; gap: 14px; }
  .q { display: flex; gap: 6px; flex: 1; }
  .m { flex: 1; height: 16px; border-radius: 99px; background: #7C8B85; position: relative; }
  .q.now .m { background: #CDE9DC; }
  .q.now .m.past { background: linear-gradient(to right, #7C8B85 35%, #CDE9DC 35%); }
  .ring { position: absolute; left: 35%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; background: #EEF1EC; border: 5px solid #10B981; box-sizing: border-box; }
  .url { position: absolute; left: 72px; bottom: 36px; font-size: 22px; font-weight: 500; color: #56655F; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="pill">FY26-Q4 · 82d</div>
  <img class="panel" src="img/mac-panel.webp" alt="">
  <div class="text">
    <h1>Fiscal Quarter</h1>
    <p>The fiscal quarter in your Mac menu bar, on your desktop, and on your iPhone.</p>
  </div>
  <div class="line">
    <div class="q"><div class="m"></div><div class="m"></div><div class="m"></div></div>
    <div class="q"><div class="m"></div><div class="m"></div><div class="m"></div></div>
    <div class="q"><div class="m"></div><div class="m"></div><div class="m"></div></div>
    <div class="q now"><div class="m past"><div class="ring"></div></div><div class="m"></div><div class="m"></div></div>
  </div>
  <div class="url">fq.mlynn.dev</div>
</body>
</html>
